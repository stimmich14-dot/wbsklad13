<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад 13 — Хоррор</title>
    <style>
        /* Базовые настройки */
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #050505 70%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Убирает полосы прокрутки */
        }

        /* Анимация появления текста */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; }
            50% { text-shadow: 0 0 20px #a855f7, 0 0 40px #a855f7; }
            100% { text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; }
        }

        /* Заголовок */
        h1 {
            color: #a855f7;
            font-size: 90px;
            margin-bottom: 10px;
            letter-spacing: 5px;
            animation: fadeInDown 1.5s ease-out, pulse 3s infinite;
            z-index: 2;
        }

        .subtitle {
            font-size: 24px;
            color: #cccccc;
            margin-bottom: 40px;
            letter-spacing: 2px;
            animation: fadeInDown 1.5s ease-out 0.5s both;
            z-index: 2;
        }

        /* Блок с информацией */
        .info-box {
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid #4a1a6e;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
            animation: fadeInUp 1.5s ease-out 1s both;
            backdrop-filter: blur(5px);
            z-index: 2;
        }

        .info-box p {
            font-size: 18px;
            line-height: 1.6;
            color: #aaaaaa;
            margin: 10px 0;
        }

        .highlight {
            color: #eab308;
            font-weight: bold;
        }

        /* Кнопка TikTok */
        .btn-tiktok {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 30px;
            padding: 15px 40px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #a855f7;
            transition: all 0.3s ease;
            animation: fadeInUp 1.5s ease-out 1.5s both;
            z-index: 2;
            cursor: pointer;
        }

        .btn-tiktok:hover {
            background-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
            transform: translateY(-3px);
        }

        /* Фоновые частицы (имитация пыли) */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            background: #a855f7;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatUp 10s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Фоновые частицы -->
    <div class="particles">
        <div class="particle" style="left: 10%; width: 4px; height: 4px; animation-duration: 8s;"></div>
        <div class="particle" style="left: 30%; width: 6px; height: 6px; animation-duration: 12s; animation-delay: 2s;"></div>
        <div class="particle" style="left: 50%; width: 3px; height: 3px; animation-duration: 6s; animation-delay: 4s;"></div>
        <div class="particle" style="left: 70%; width: 5px; height: 5px; animation-duration: 15s; animation-delay: 1s;"></div>
        <div class="particle" style="left: 90%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 3s;"></div>
    </div>

    <!-- Контент -->
    <h1>СКЛАД 13</h1>
    <div class="subtitle">Ночная смена в Wildberries</div>

    <div class="info-box">
        <p><span class="highlight">Внимание!</span> Игра находится в ранней стадии разработки.</p>
        <p>Я только начал её строить, поэтому здесь пока нет ссылки на скачивание. Я буду выкладывать обновления по мере разработки.</p>
        <p>Следите за новостями!</p>
        
        <!-- Кнопка TikTok -->
        <a href="https://www.tiktok.com/@user3904688635639" class="btn-tiktok" target="_blank">
            🎵 Мой TikTok
        </a>
    </div>

</body>
</html>
