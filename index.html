<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад 13 — Хоррор</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        /* --- БАЗА --- */
        body {
            background-color: #030308;
            background-image: radial-gradient(circle at 50% 0%, #1d0b33 0%, #030308 80%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes blinkOrnament { 0% { opacity: 0.5; box-shadow: 0 0 10px currentColor; } 100% { opacity: 1; box-shadow: 0 0 25px currentColor, 0 0 50px currentColor; } }

        /* --- ГИРЛЯНДА --- */
        .garland-container { position: absolute; top: 0; left: 0; width: 100%; height: 180px; z-index: 10; pointer-events: none; }
        .wire { position: absolute; top: 20px; left: 0; width: 100%; height: 2px; background: #333; }
        .garland-drop {
            position: absolute; top: 20px; left: 0; width: 100%; height: 100%;
            border-bottom: 3px solid #222; border-radius: 0 0 50% 50%;
            animation: swing 5s ease-in-out infinite alternate; transform-origin: top center;
        }
        @keyframes swing { 0% { transform: rotate(0.5deg); } 100% { transform: rotate(-0.5deg); } }
        .bulb { position: absolute; width: 14px; height: 22px; border-radius: 50% 50% 30% 30%; transform: translate(-50%, -50%); opacity: 0.2; }
        .bulb.active { opacity: 1; box-shadow: 0 0 15px currentColor, 0 0 30px currentColor; transform: translate(-50%, -50%) scale(1.2); }
        .bulb.red { background: #ff2020; color: #ff2020; } .bulb.green { background: #20ff20; color: #20ff20; }
        .bulb.blue { background: #2020ff; color: #2020ff; } .bulb.yellow { background: #ffff20; color: #ffff20; }
        .bulb.purple { background: #d020ff; color: #d020ff; }

        /* --- ЗАГОЛОВОК --- */
        h1 {
            font-size: 60px; font-weight: 900; margin-top: 80px; margin-bottom: 10px; letter-spacing: 4px; text-align: center; z-index: 2;
            background: linear-gradient(to bottom, #ffffff 0%, #a855f7 40%, #d020ff 60%, #ffffff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(208, 32, 255, 0.8));
            animation: fadeInDown 1.5s ease-out, float 4s ease-in-out infinite; 
        }
        .subtitle { font-size: 14px; color: #d020ff; margin-bottom: 20px; letter-spacing: 3px; text-transform: uppercase; font-weight: 900; text-align: center; z-index: 2; animation: fadeInDown 1.5s ease-out 0.5s both; }

        /* --- БЛОК --- */
        .info-box {
            background: rgba(10, 5, 20, 0.85); border: 1px solid rgba(168, 85, 247, 0.5); border-radius: 15px; padding: 20px;
            width: 85%; max-width: 350px; margin: 0 auto; z-index: 2; text-align: center; position: relative;
            animation: fadeInUp 1.5s ease-out 1s both;
        }
        .info-box p { font-size: 14px; line-height: 1.5; color: #eeeeee; margin: 8px 0; }
        .highlight { color: #ffff00; font-weight: 900; text-transform: uppercase; }

        /* --- КНОПКА --- */
        .btn-tiktok {
            display: inline-flex; align-items: center; justify-content: center; margin-top: 15px; padding: 10px 25px;
            background: linear-gradient(45deg, #000, #4a0e8f); color: #ffffff; text-decoration: none; border-radius: 50px;
            font-size: 16px; font-weight: 900; border: 2px solid #d020ff; z-index: 2;
            position: relative; overflow: hidden; transition: all 0.4s ease;
            animation: float 5s ease-in-out infinite; 
        }
        .btn-tiktok:hover { background: #d020ff; color: #000; transform: scale(1.05) !important; box-shadow: 0 0 30px #d020ff; border-color: #fff; animation: none; }

        /* --- ТЕКСТ ВНИЗУ --- */
        .footer-text { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #aaa; font-size: 12px; font-style: italic; z-index: 2; animation: fadeInUp 2s ease-out 2s both; }

        /* --- ЁЛКА --- */
        .tree-container { position: absolute; bottom: 0px; left: -10px; z-index: 3; transform: scale(0.35); transform-origin: bottom left; display: flex; flex-direction: column; align-items: center; }
        .tree-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
        .star-top { font-size: 50px; margin-bottom: -20px; z-index: 10; text-shadow: 0 0 30px #ffff00, 0 0 60px #ffff00; }
        .tree-layer { width: 0; height: 0; border-left: 80px solid transparent; border-right: 80px solid transparent; border-bottom: 110px solid #063b1c; margin-bottom: -45px; position: relative; z-index: 1; }
        .tree-layer:nth-child(3) { border-left-width: 65px; border-right-width: 65px; border-bottom-width: 100px; border-bottom-color: #0a4d25; }
        .tree-layer:nth-child(4) { border-left-width: 50px; border-right-width: 50px; border-bottom-width: 90px; border-bottom-color: #0e5e2e; }
        .tree-garland { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 120px; height: 150px; border: 3px dashed #ffd700; border-radius: 50%; border-bottom-color: transparent; border-left-color: transparent; transform: translateX(-50%) rotate(45deg); z-index: 2; opacity: 0.8; filter: drop-shadow(0 0 10px #ffd700); }
        .ornament { position: absolute; border-radius: 50%; animation: blinkOrnament 1.5s infinite alternate; z-index: 5; }
        .orn1 { width: 18px; height: 18px; background: #ff3333; top: 50px; left: -25px; color: #ff3333; animation-delay: 0.1s; }
        .orn2 { width: 15px; height: 15px; background: #ffff33; top: 70px; left: 35px; color: #ffff33; animation-delay: 0.5s; }
        .orn3 { width: 22px; height: 22px; background: #3333ff; top: 110px; left: -45px; color: #3333ff; animation-delay: 0.9s; }
        .orn4 { width: 16px; height: 16px; background: #d020ff; top: 130px; left: 30px; color: #d020ff; animation-delay: 1.2s; }
        .orn5 { width: 14px; height: 14px; background: #ff3333; top: 160px; left: -20px; color: #ff3333; animation-delay: 0.3s; }
        .trunk { width: 30px; height: 50px; background: #2d1205; z-index: 0; margin-top: -5px; }
        .gift { position: absolute; z-index: 4; border-radius: 3px; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        .gift::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background: #fff; transform: translateY(-50%); }
        .gift::before { content: ''; position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: #fff; transform: translateX(-50%); }
        .gift1 { width: 40px; height: 30px; background: #cc0000; bottom: -10px; left: -40px; transform: rotate(-10deg); }
        .gift2 { width: 30px; height: 40px; background: #0066cc; bottom: -15px; right: -30px; transform: rotate(15deg); }
        .gift3 { width: 35px; height: 25px; background: #ffcc00; bottom: -5px; left: 10px; transform: rotate(5deg); }

        /* --- СНЕГОВИК --- */
        .snowman-container { 
            position: absolute; bottom: 0px; right: -10px; z-index: 3; 
            transform: scale(0.35); transform-origin: bottom right; 
            display: flex; flex-direction: column; align-items: center; 
            filter: drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.9)); 
        }
        .snowball { 
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e0e0e0 40%, #999 100%); 
            border-radius: 50%; z-index: 2; 
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.4), inset 10px 10px 20px rgba(255,255,255,0.8);
        }
        .snowball-1 { width: 120px; height: 120px; } 
        .snowball-2 { width: 90px; height: 90px; margin-bottom: -25px; position: relative; }
        .snowball-3 { width: 70px; height: 70px; margin-bottom: -25px; position: relative; }
        .arm { position: absolute; width: 55px; height: 5px; background: #4a2c11; border-radius: 3px; z-index: 1; box-shadow: 0 3px 5px rgba(0,0,0,0.5); }
        .arm-left { top: 35px; left: -45px; transform: rotate(35deg); }
        .arm-right { top: 35px; right: -45px; transform: rotate(-35deg); }
        .arm::after { content: ''; position: absolute; width: 15px; height: 4px; background: #4a2c11; border-radius: 2px; }
        .arm-left::after { top: -6px; left: 2px; transform: rotate(-45deg); }
        .arm-right::after { top: -6px; right: 2px; transform: rotate(45deg); }
        .eye { position: absolute; top: 18px; width: 10px; height: 14px; background: #111; border-radius: 50%; z-index: 3; box-shadow: 0 2px 3px rgba(0,0,0,0.5); }
        .eye-left { left: 16px; } .eye-right { right: 16px; }
        .smile { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); width: 26px; height: 12px; border-bottom: 4px solid #111; border-radius: 0 0 50% 50%; z-index: 3; }
        .nose { width: 32px; height: 9px; background: linear-gradient(to right, #ff9900, #ff5500); position: absolute; top: 28px; left: 48px; border-radius: 50%; transform: rotate(10deg); z-index: 3; box-shadow: 0 3px 5px rgba(0,0,0,0.5); }
        .scarf { position: absolute; top: -15px; width: 90px; height: 22px; background: linear-gradient(to bottom, #ff3333, #cc0000); border-radius: 10px; z-index: 4; box-shadow: 0 5px 10px rgba(0,0,0,0.6); }
        .scarf-tail { position: absolute; top: 5px; left: 15px; width: 18px; height: 45px; background: #cc0000; transform: rotate(-15deg); z-index: 1; border-radius: 5px; box-shadow: 0 5px 10px rgba(0,0,0,0.6); }
        .hat { position: absolute; top: -55px; left: 50%; transform: translateX(-50%); width: 65px; height: 45px; background: #1a1a1a; border-radius: 10px 10px 0 0; z-index: 5; }
        .hat-brim { position: absolute; top: 0px; left: -8px; width: 80px; height: 12px; background: #1a1a1a; border-radius: 6px; z-index: 6; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .hat-pompom { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background: #fff; border-radius: 50%; z-index: 4; box-shadow: 0 0 10px rgba(255,255,255,0.8); }

        /* --- ПЛАНШЕТЫ И ПК --- */
        @media (min-width: 768px) {
            h1 { font-size: 120px; letter-spacing: 12px; margin-top: 100px; filter: drop-shadow(0 0 25px rgba(208, 32, 255, 1)) drop-shadow(0 0 50px rgba(168, 85, 247, 0.8)); }
            .subtitle { font-size: 24px; letter-spacing: 8px; text-shadow: 0 0 15px #d020ff; }
            .info-box { padding: 40px 50px; max-width: 600px; box-shadow: 0 0 40px rgba(168, 85, 247, 0.4), inset 0 0 20px rgba(208, 32, 255, 0.2); border-color: rgba(208, 32, 255, 0.8); }
            .info-box p { font-size: 19px; margin: 12px 0; }
            .btn-tiktok { padding: 18px 55px; font-size: 22px; margin-top: 30px; }
            .footer-text { font-size: 17px; bottom: 20px; }
            .tree-container { left: 5%; transform: scale(1); z-index: 3; filter: drop-shadow(0 0 20px rgba(0, 255, 100, 0.5)); }
            .snowman-container { right: 5%; transform: scale(1); z-index: 3; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4)) drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.9)); }
            .bulb { box-shadow: 0 0 10px currentColor; }
            .bulb.active { box-shadow: 0 0 25px currentColor, 0 0 50px currentColor, 0 0 80px currentColor; transform: translate(-50%, -50%) scale(1.3); }
        }

        /* --- СНЕГ --- */
        .snow-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .snowflake { position: absolute; top: -10px; background-color: white; border-radius: 50%; opacity: 0.6; animation: fall linear infinite; }
        @media (min-width: 768px) { .snowflake { filter: blur(1.5px); box-shadow: 0 0 8px rgba(255, 255, 255, 0.9); opacity: 0.9; } }
        @keyframes fall { 0% { transform: translateY(-10px) translateX(0); } 100% { transform: translateY(105vh) translateX(50px); } }

        /* --- САЛЮТ --- */
        canvas#fireworks-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    </style>
</head>
<body>

    <div class="garland-container">
        <div class="wire"></div>
        <div class="garland-drop" id="garland-drop"></div>
    </div>

    <div class="snow-container" id="snow-container"></div>
    <canvas id="fireworks-canvas"></canvas>

    <div class="tree-container">
        <div class="tree-wrapper">
            <div class="star-top">⭐</div>
            <div class="tree-layer">
                <div class="tree-garland"></div>
                <div class="ornament orn1"></div>
                <div class="ornament orn2"></div>
            </div>
            <div class="tree-layer">
                <div class="ornament orn3"></div>
                <div class="ornament orn4"></div>
            </div>
            <div class="tree-layer">
                <div class="ornament orn5"></div>
            </div>
            <div class="trunk"></div>
            <div class="gift gift1"></div>
            <div class="gift gift2"></div>
            <div class="gift gift3"></div>
        </div>
    </div>

    <div class="snowman-container">
        <div class="snowball snowball-3">
            <div class="hat-pompom"></div>
            <div class="hat"></div>
            <div class="hat-brim"></div>
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
            <div class="smile"></div>
            <div class="nose"></div>
            <div class="scarf"></div>
            <div class="scarf-tail"></div>
        </div>
        <div class="snowball snowball-2">
            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>
        </div>
        <div class="snowball snowball-1"></div>
    </div>

    <h1>СКЛАД 13</h1>
    <div class="subtitle">Ночная смена в Wildberries</div>

    <div class="info-box">
        <p><span class="highlight">Внимание!</span> Игра находится в ранней стадии разработки.</p>
        <p>Я только начал её строить, поэтому здесь пока нет ссылки на скачивание. Я буду выкладывать обновления по мере разработки.</p>
        <p>Следите за новостями!</p>
        
        <a href="https://www.tiktok.com/@user3904688635639" class="btn-tiktok" target="_blank">
            🎵 Мой TikTok
        </a>
    </div>

    <div class="footer-text">
        Скоро будут выходить видео с моей игрой <span>🎬👻</span>
    </div>

    <script>
        const isDesktop = window.innerWidth >= 768;

        // --- САЛЮТ (ПЛОТНЫЙ ДЫМ, НО ВИДЕН ВЗРЫВ) ---
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        const fireworks = [];
        const particles = [];
        const smoke = []; 
        let lastSpawn = 0;
        let flashAlpha = 0;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function random(min, max) { return Math.random() * (max - min) + min; }

        function createFirework() {
            const x = random(w * 0.1, w * 0.9);
            const y = h;
            const targetY = random(h * 0.1, h * 0.4);
            const color = `hsl(${random(0, 360)}, 100%, 60%)`;
            fireworks.push({ x, y, targetY, color, speed: isDesktop ? 3.5 : 7 });
        }

        function updateAndDraw() {
            ctx.clearRect(0, 0, w, h);
            
            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha * 0.5})`;
                ctx.fillRect(0, 0, w, h);
                flashAlpha -= 0.04; 
            }

            const now = Date.now();
            if (now - lastSpawn > 2000) { // Ракеты раз в 2 секунды
                createFirework();
                lastSpawn = now;
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const f = fireworks[i];
                f.y -= f.speed; 
                
                ctx.beginPath();
                ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = f.color;
                ctx.fill();
                ctx.shadowBlur = 0;

                // ДЫМ ОТ РАКЕТЫ (плотнее)
                if (isDesktop) {
                    if (Math.random() > 0.4) { 
                        smoke.push({
                            x: f.x + random(-3, 3), y: f.y + random(0, 10), 
                            vx: random(-0.5, 0.5), vy: random(0.5, 1.5),
                            life: 1, size: random(8, 15), alpha: 0.25 // Плотнее
                        });
                    }
                }
                
                if (f.y <= f.targetY) {
                    flashAlpha = 1.0; 
                    const explodeCount = isDesktop ? 120 : 40; 
                    
                    for (let j = 0; j < explodeCount; j++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = random(1, 12); 
                        particles.push({
                            x: f.x, y: f.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                            life: 1, color: f.color, size: random(1.5, 5.0)
                        });
                    }
                    // ДЫМ ПОСЛЕ ВЗРЫВА (плотные клубы)
                    if (isDesktop) {
                        for(let s=0; s<15; s++) { 
                            smoke.push({
                                x: f.x + random(-25, 25), y: f.y + random(-25, 25),
                                vx: random(-1, 1), vy: random(-1, 0.5),
                                life: 1.2, size: random(30, 60), alpha: 0.25 // Ярче и больше
                            });
                        }
                    }
                    fireworks.splice(i, 1);
                }
            }

            // ДЫМ
            for (let i = smoke.length - 1; i >= 0; i--) {
                const s = smoke[i];
                s.x += s.vx; s.y += s.vy; 
                s.life -= 0.015; 
                if (s.life <= 0) { smoke.splice(i, 1); continue; }
                
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                // Дым теперь серый и плотный, но прозрачный по краям
                ctx.fillStyle = `rgba(180, 180, 180, ${s.life * s.alpha})`; 
                ctx.fill();
            }

            // ИСКРЫ (всегда поверх дыма)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; 
                p.vy += 0.08; 
                p.vx *= 0.96; p.vy *= 0.96; 
                p.life -= 0.008; 
                
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                
                if (isDesktop) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = p.color;
                }
                
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            requestAnimationFrame(updateAndDraw);
        }
        updateAndDraw();

        // --- СНЕГ ---
        const snowContainer = document.getElementById('snow-container');
        const snowCount = isDesktop ? 150 : 30;
        for (let i = 0; i < snowCount; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            const size = Math.random() * 6 + 1; 
            snowflake.style.width = size + 'px'; snowflake.style.height = size + 'px';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = (Math.random() * 8 + 5) + 's';
            snowflake.style.animationDelay = (Math.random() * 5) + 's';
            snowContainer.appendChild(snowflake);
        }

        // --- ГИРЛЯНДА ---
        const bulbsContainer = document.getElementById('garland-drop');
        const colors = ['red', 'green', 'blue', 'yellow', 'purple'];
        const bulbCount = isDesktop ? 55 : 20;
        const bulbs = []; 
        
        for (let i = 0; i <= bulbCount; i++) {
            const bulb = document.createElement('div');
            bulb.classList.add('bulb');
            bulb.classList.add(colors[i % colors.length]);
            const xPercent = (i / bulbCount) * 100;
            bulb.style.left = xPercent + '%';
            const normalizedX = (xPercent - 50) / 50;
            const yPercent = (1 - (normalizedX * normalizedX)) * 150;
            bulb.style.top = (10 + yPercent) + 'px';
            bulbsContainer.appendChild(bulb);
            bulbs.push(bulb);
        }

        const blinkRate = isDesktop ? 150 : 250;
        setInterval(() => {
            bulbs.forEach(bulb => {
                if (Math.random() > 0.5) {
                    bulb.classList.add('active');
                } else {
                    bulb.classList.remove('active');
                }
            });
        }, blinkRate);
    </script>
</body>
</html>
