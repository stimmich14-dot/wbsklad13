<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад 13 — Хоррор</title>
    <style>
        /* Базовые настройки */
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #050505 70%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Анимация появления текста */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; }
            50% { text-shadow: 0 0 20px #a855f7, 0 0 40px #a855f7; }
            100% { text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; }
        }

        /* Заголовок */
        h1 {
            color: #a855f7;
            font-size: 90px;
            margin-bottom: 10px;
            letter-spacing: 5px;
            animation: fadeInDown 1.5s ease-out, pulse 3s infinite;
            z-index: 2;
            text-align: center;
        }

        .subtitle {
            font-size: 24px;
            color: #cccccc;
            margin-bottom: 40px;
            letter-spacing: 2px;
            animation: fadeInDown 1.5s ease-out 0.5s both;
            z-index: 2;
            text-align: center;
        }

        /* Блок с информацией */
        .info-box {
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid #4a1a6e;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
            animation: fadeInUp 1.5s ease-out 1s both;
            backdrop-filter: blur(5px);
            z-index: 2;
            text-align: center;
        }

        .info-box p {
            font-size: 18px;
            line-height: 1.6;
            color: #aaaaaa;
            margin: 10px 0;
        }

        .highlight {
            color: #eab308;
            font-weight: bold;
        }

        /* Кнопка TikTok */
        .btn-tiktok {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 30px;
            padding: 15px 40px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #a855f7;
            transition: all 0.3s ease;
            animation: fadeInUp 1.5s ease-out 1.5s both;
            z-index: 2;
            cursor: pointer;
        }

        .btn-tiktok:hover {
            background-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
            transform: translateY(-3px);
        }

        /* Текст в самом низу */
        .footer-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #888888;
            font-size: 18px;
            animation: fadeInUp 2s ease-out 2s both;
            z-index: 2;
        }
        .footer-text span {
            color: #a855f7;
            font-weight: bold;
        }

        /* АНИМАЦИЯ СНЕГА */
        .snow-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            background-color: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(100vh) translateX(50px); }
        }
    </style>
</head>
<body>

    <!-- Фоновый снег (скрипт ниже создаст 50 снежинок) -->
    <div class="snow-container" id="snow-container"></div>

    <!-- Контент -->
    <h1>СКЛАД 13</h1>
    <div class="subtitle">Ночная смена в Wildberries</div>

    <div class="info-box">
        <p><span class="highlight">Внимание!</span> Игра находится в ранней стадии разработки.</p>
        <p>Я только начал её строить, поэтому здесь пока нет ссылки на скачивание. Я буду выкладывать обновления по мере разработки.</p>
        <p>Следите за новостями!</p>
        
        <!-- Кнопка TikTok -->
        <a href="https://www.tiktok.com/@user3904688635639" class="btn-tiktok" target="_blank">
            🎵 Мой TikTok
        </a>
    </div>

    <!-- Текст внизу -->
    <div class="footer-text">
        Скоро будут выходить видео с моей игрой 🎬👻
    </div>

    <!-- Скрипт для генерации снежинок -->
    <script>
        const container = document.getElementById('snow-container');
        const snowflakeCount = 50; // Количество снежинок

        for (let i = 0; i < snowflakeCount; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            // Случайный размер от 2 до 6 пикселей
            const size = Math.random() * 4 + 2;
            snowflake.style.width = size + 'px';
            snowflake.style.height = size + 'px';
            
            // Случайная позиция по горизонтали
            snowflake.style.left = Math.random() * 100 + 'vw';
            
            // Случайная скорость падения (от 3 до 10 секунд)
            const duration = Math.random() * 7 + 3;
            snowflake.style.animationDuration = duration + 's';
            
            // Случайная задержка, чтобы снег падал не одновременно
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            
            // Случайная прозрачность
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;

            container.appendChild(snowflake);
        }
    </script>
</body>
</html>
