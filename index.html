<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад 13 — Новогодний хоррор</title>
    <style>
        /* Базовые настройки */
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #050505 70%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ГИРЛЯНДА СВЕРХУ */
        .garland {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 10;
        }
        .bulb {
            width: 15px;
            height: 25px;
            border-radius: 50% 50% 30% 30%;
            animation: blink 1.5s infinite alternate;
            box-shadow: 0 0 10px currentColor;
        }
        .bulb:nth-child(odd) { animation-duration: 1s; animation-delay: 0.2s; }
        .bulb:nth-child(even) { animation-duration: 1.8s; animation-delay: 0.5s; }
        .bulb.red { background: #ff3333; color: #ff3333; }
        .bulb.green { background: #33ff33; color: #33ff33; }
        .bulb.blue { background: #3333ff; color: #3333ff; }
        .bulb.yellow { background: #ffff33; color: #ffff33; }

        @keyframes blink {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* Анимация появления */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; }
            50% { text-shadow: 0 0 20px #a855f7, 0 0 40px #a855f7, 0 0 60px #a855f7; }
            100% { text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; }
        }

        /* Заголовок */
        h1 {
            color: #ffffff;
            font-size: 85px;
            margin-top: 40px;
            margin-bottom: 10px;
            letter-spacing: 8px;
            animation: fadeInDown 1.5s ease-out, pulse 3s infinite;
            z-index: 2;
            text-align: center;
        }

        .subtitle {
            font-size: 20px;
            color: #aaaaaa;
            margin-bottom: 30px;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeInDown 1.5s ease-out 0.5s both;
            z-index: 2;
        }

        /* Блок с информацией */
        .info-box {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid #4a1a6e;
            border-radius: 20px;
            padding: 30px 40px;
            max-width: 550px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15);
            animation: fadeInUp 1.5s ease-out 1s both;
            backdrop-filter: blur(10px);
            z-index: 2;
            text-align: center;
            position: relative;
        }

        .info-box p {
            font-size: 18px;
            line-height: 1.6;
            color: #cccccc;
            margin: 10px 0;
        }

        .highlight {
            color: #eab308;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Кнопка TikTok */
        .btn-tiktok {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            padding: 15px 40px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #a855f7;
            transition: all 0.3s ease;
            z-index: 2;
        }
        .btn-tiktok:hover {
            background-color: #a855f7;
            color: #000;
            box-shadow: 0 0 30px rgba(168, 85, 247, 1);
            transform: translateY(-5px) scale(1.05);
        }

        /* ЁЛКА (слева) */
        .tree {
            position: absolute;
            bottom: 0;
            left: 50px;
            z-index: 3;
            animation: fadeInUp 2s ease-out 1.5s both;
        }
        .tree-part {
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 80px solid #0a5c36;
            margin-bottom: -30px;
            position: relative;
        }
        .tree-part:nth-child(2) { border-left-width: 50px; border-right-width: 50px; border-bottom-width: 70px; }
        .tree-part:nth-child(3) { border-left-width: 40px; border-right-width: 40px; border-bottom-width: 60px; }
        .tree-trunk { width: 20px; height: 30px; background: #4a2c11; margin: 0 auto; }
        .star { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 30px; }
        
        /* СНЕГОВИК (справа) */
        .snowman {
            position: absolute;
            bottom: 0;
            right: 50px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 2s ease-out 1.8s both;
        }
        .snowball {
            background: #e0e0e0;
            border-radius: 50%;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2);
        }
        .snowball-1 { width: 80px; height: 80px; }
        .snowball-2 { width: 60px; height: 60px; margin-bottom: -10px; }
        .snowball-3 { width: 45px; height: 45px; margin-bottom: -10px; position: relative; }
        .snowman-face { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; white-space: nowrap; }
        .carrot { width: 15px; height: 4px; background: orange; position: absolute; top: 25px; left: 30px; border-radius: 2px; }

        /* СНЕГ */
        .snow-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .snowflake { position: absolute; top: -10px; background-color: white; border-radius: 50%; opacity: 0.8; animation: fall linear infinite; }
        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(105vh) translateX(50px); }
        }

        /* Текст внизу */
        .footer-text { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #777; font-size: 16px; z-index: 2; }
    </style>
</head>
<body>

    <!-- Гирлянда -->
    <div class="garland">
        <div class="bulb red"></div><div class="bulb green"></div><div class="bulb blue"></div><div class="bulb yellow"></div>
        <div class="bulb red"></div><div class="bulb green"></div><div class="bulb blue"></div><div class="bulb yellow"></div>
        <div class="bulb red"></div><div class="bulb green"></div><div class="bulb blue"></div><div class="bulb yellow"></div>
        <div class="bulb red"></div><div class="bulb green"></div><div class="bulb blue"></div><div class="bulb yellow"></div>
    </div>

    <!-- Снег -->
    <div class="snow-container" id="snow-container"></div>

    <!-- Ёлка (слева) -->
    <div class="tree">
        <div class="star">⭐</div>
        <div class="tree-part"></div>
        <div class="tree-part"></div>
        <div class="tree-part"></div>
        <div class="tree-trunk"></div>
    </div>

    <!-- Снеговик (справа) -->
    <div class="snowman">
        <div class="snowball snowball-3">
            <div class="snowman-face">👀</div>
            <div class="carrot"></div>
        </div>
        <div class="snowball snowball-2"></div>
        <div class="snowball snowball-1"></div>
    </div>

    <!-- Контент -->
    <h1>СКЛАД 13</h1>
    <div class="subtitle">Ночная смена в Wildberries</div>

    <div class="info-box">
        <p><span class="highlight">Внимание!</span> Игра находится в ранней стадии разработки.</p>
        <p>Я только начал её строить, поэтому здесь пока нет ссылки на скачивание. Я буду выкладывать обновления по мере разработки.</p>
        <p>Следите за новостями!</p>
        
        <a href="https://www.tiktok.com/@user3904688635639" class="btn-tiktok" target="_blank">
            🎵 Мой TikTok
        </a>
    </div>

    <div class="footer-text">
        Скоро будут выходить видео с моей игрой 🎬👻
    </div>

    <!-- Скрипт для снега -->
    <script>
        const container = document.getElementById('snow-container');
        for (let i = 0; i < 60; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            const size = Math.random() * 4 + 1;
            snowflake.style.width = size + 'px';
            snowflake.style.height = size + 'px';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = (Math.random() * 7 + 4) + 's';
            snowflake.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(snowflake);
        }
    </script>
</body>
</html>
